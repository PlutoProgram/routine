<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<title>Tagwerk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=DM+Mono:wght@500&display=swap">
<style>
:root{--bg:#cdd2c4;--card:#e4e7da;--ink:#1c2826;--mut:#5d6a64;--acc:#d99a1e;--red:#c0402e;--ok:#3f6b4a;--line:#aab2a4;--tape:#1c2826;--tapeink:#e8c46a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b1a;--card:#232a28;--ink:#e3e6dc;--mut:#8c978f;--acc:#e8b43c;--red:#e0705c;--ok:#8fbf8d;--line:#364039;--tape:#0c0f0e;--tapeink:#e8b43c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171b1a;--card:#232a28;--ink:#e3e6dc;--mut:#8c978f;--acc:#e8b43c;--red:#e0705c;--ok:#8fbf8d;--line:#364039;--tape:#0c0f0e;--tapeink:#e8b43c;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,-apple-system,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:800;margin:20px 0 8px}
.sub{color:var(--mut);margin:0 0 14px}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace}
.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.hab{cursor:pointer;user-select:none;-webkit-user-select:none}
.hab.done{background:var(--ok);color:#fff;border-color:var(--ink)}
.hab .t{font-weight:600}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:14px;height:14px;border:2px solid currentColor;border-radius:50%}
.dots i.on{background:currentColor}
.tape{background:var(--tape);color:var(--tapeink);font-family:"DM Mono",ui-monospace,monospace;font-size:22px;padding:4px 8px;border-radius:5px;letter-spacing:3px;min-width:58px;text-align:center}
.tape small{display:block;font-size:9px;letter-spacing:1px;opacity:.8}
.big{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pbar{height:10px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.pbar b{display:block;height:100%;background:var(--acc)}
input,button,textarea{font:inherit;color:var(--ink)}
input,textarea,select{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:9px 10px;width:100%;font:inherit;color:var(--ink)}
.form select{width:auto}
.btn{background:var(--acc);border:2px solid var(--ink);border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;color:#1c2826}
.btn.ghost{background:transparent;color:var(--ink)}
.x{background:none;border:0;font-size:22px;color:var(--red);cursor:pointer;padding:10px 12px}
.form{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.form input[type=number]{width:72px}
.form input[type=time],.form input[type=date]{width:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tape);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--tapeink);opacity:.55;font-weight:800;padding:10px 0;border-radius:8px;cursor:pointer}
nav button.on{opacity:1;background:rgba(255,255,255,.12)}
html,body{max-width:100%;overflow-x:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{text-align:center;color:var(--mut);font-size:12px;font-weight:600}
.cal button{height:52px;min-width:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600}
.cal button.has{background:var(--card);border-color:var(--ink)}
.cal button.today span{text-decoration:underline;text-underline-offset:3px}
.cal button em{display:flex;gap:2px;justify-content:center;height:7px;margin-top:3px}
.cal button.today{border-color:var(--ink)}
.cal button.sel{background:var(--acc);border-color:var(--ink);color:#1c2826}
.cal button i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.cal button i.d{background:var(--ok)}
.over{color:var(--red);font-weight:600}
.mut{color:var(--mut)}
.chk{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;background:var(--card);cursor:pointer;flex:none;font-weight:800;line-height:1;color:var(--ok)}
.strike{text-decoration:line-through;color:var(--mut)}
textarea{height:130px;font-family:"DM Mono",ui-monospace,monospace;font-size:12px}
.empty{color:var(--mut);padding:8px 0}
.form label{display:flex;align-items:center;gap:6px;color:var(--mut)}
.card.task.ev{border-left-color:var(--red)}
.card.task{border-left:8px solid var(--acc);border-radius:4px 10px 10px 4px}
.task .grow>div:first-child{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:15px}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const K='tagwerk-v1';
const D=()=>({habits:[{id:'h1',name:'Flasche trinken',target:3},{id:'h2',name:'Kreatin nehmen',target:1},{id:'h3',name:'Magnesium nehmen',target:1},{id:'h4',name:'Um 6 aufstehen',target:1},{id:'h5',name:'Bett machen',target:1}],log:{},events:[],todos:[],lastBackup:0});
let S;try{S=JSON.parse(localStorage.getItem(K))||D()}catch(e){S=D()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!S.weekly){S.weekly=[{id:'w1',title:'Weeklys rausschicken',day:0},{id:'w2',title:'Retainer putzen',day:0}];S.wlog={}}
S.ideas=S.ideas||[];
const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmt=s=>{const[y,m,d]=s.split('-');return d+'.'+m+'.'+y};
let pd='';let tab='heute',edit=false,cm=new Date(),sel=today(),msg='';
cm.setDate(1);
const cnt=(day,id)=>(S.log[day]&&S.log[day][id])||0;
const isDone=(day,h)=>cnt(day,h.id)>=h.target;
function streak(h){let d=new Date(),n=0;if(!isDone(ds(d),h))d.setDate(d.getDate()-1);
while(isDone(ds(d),h)){n++;d.setDate(d.getDate()-1)}return n}
function allStreak(){let d=new Date(),n=0;const ok=x=>S.habits.length&&S.habits.every(h=>isDone(x,h));
if(!ok(ds(d)))d.setDate(d.getDate()-1);while(ok(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
function weeklyToday(){const t=today(),wd=new Date().getDay(),l=S.weekly.filter(w=>w.day===wd);
if(!l.length)return '';
return '<h2>Heute fällig, jede Woche</h2>'+l.map(w=>{const d=S.wlog[t]&&S.wlog[t][w.id];return `<div class="card row"><button class="chk" data-a="wtog" data-id="${w.id}" aria-label="Erledigt">${d?'✓':''}</button><div class="grow ${d?'strike':''}">${esc(w.title)}</div></div>`}).join('')}
function vHeute(){
const t=today(),dn=S.habits.filter(h=>isDone(t,h)).length,tot=S.habits.length,pct=tot?dn/tot*100:0;
const wd=new Date().toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long'});
const as=allStreak();
return `<h1>Heute</h1><p class="sub">${esc(wd)}</p>
<div class="card"><div class="big"><div class="grow"><b>${dn} von ${tot} geschafft</b><div class="pbar" style="margin-top:8px"><b style="width:${pct}%"></b></div></div>
<div class="tape"><small>STREAK</small>${String(as).padStart(3,'0')}</div></div></div>
${S.habits.map(h=>{const c=cnt(t,h.id),dn=c>=h.target;return `<div class="card hab row ${dn?'done':''}" data-a="inc" data-id="${h.id}">
<div class="grow"><div class="t">${esc(h.name)}</div><div class="dots">${Array.from({length:h.target},(_,i)=>`<i class="${i<c?'on':''}"></i>`).join('')}</div></div>
${edit?`<button class="x" data-a="delh" data-id="${h.id}">×</button>`:`<div class="tape"><small>TAGE</small>${String(streak(h)).padStart(3,'0')}</div>`}</div>`}).join('')||'<div class="empty">Noch keine Gewohnheiten. Leg unten eine an.</div>'}
${todayTasks()}
<p class="mut" style="font-size:13px">Tippen zählt hoch. Nach dem letzten Punkt setzt ein weiterer Tipp auf null zurück.</p>`}
function todayTasks(){const t=today(),wd=new Date().getDay(),L=[];
S.todos.filter(x=>x.due&&x.due<=t&&(!x.done||x.due===t)).forEach(x=>L.push({k:'t',id:x.id,title:x.title,time:x.time||'',done:x.done,c:cntT(x),g:x.target||1,over:x.due<t&&!x.done,due:x.due}));
S.weekly.filter(w=>w.day===wd).forEach(w=>L.push({k:'w',id:w.id,title:w.title,time:w.time||'',c:cntW(t,w),g:w.target||1,done:cntW(t,w)>=(w.target||1),over:false,due:t}));
S.events.filter(e=>e.date===t).forEach(e=>L.push({k:'e',id:e.id,title:e.title,time:e.time||'',end:e.end||'',done:false,over:false,due:t,c:0,g:0}));
if(!L.length)return '';
L.sort((a,b)=>(a.done-b.done)||((b.over?1:0)-(a.over?1:0))||(a.time||'99:99').localeCompare(b.time||'99:99'));
return '<h2>Heute dran</h2>'+L.map(i=>`<div class="card task ${i.k==='e'?'ev':'hab'} row ${i.done?'done':''}" ${i.k==='e'?'':`data-a="${i.k==='t'?'tog':'wtog'}" data-id="${i.id}"`}><div class="grow"><div class="t">${esc(i.title)}</div>${i.over?`<div class="over" style="font-size:13px">Überfällig seit ${fmt(i.due)}</div>`:''}${i.k==='e'?`<div class="mut" style="font-size:13px">${esc(i.time?i.time+(i.end?'–'+i.end:''):'ganztägig')}</div>`:`<div class="dots">${Array.from({length:i.g},(_,n)=>`<i class="${n<i.c?'on':''}"></i>`).join('')}</div>`}</div><div class="tape"><small>${i.k==='w'?'WOCHE':i.k==='e'?'TERMIN':'TODO'}</small>${esc(i.time||'--:--')}</div></div>`).join('')}
function ideasView(){return `<h2>Ideen</h2><p class="mut" style="margin:0 0 8px">Dinge, die du irgendwann machen willst, ohne Termin. Damit sie nicht verloren gehen.</p>
${S.ideas.map(n=>`<div class="card row"><div class="grow"><div class="t">${esc(n.text)}</div></div><div class="tape"><small>NOTIERT</small>${esc(n.day.slice(8,10)+'.'+n.day.slice(5,7))}</div><button class="x" data-a="deli" data-id="${n.id}">${pd===n.id?'<small style="font-size:13px;font-weight:800">Löschen?</small>':'×'}</button></div>`).join('')||'<div class="empty">Noch keine Ideen.</div>'}
<div class="form"><input id="idn" placeholder="z. B. Mixen lernen" style="flex:1"><button class="btn" data-a="addi">Hinzufügen</button></div>`}
const cntT=x=>x.count||(x.done?(x.target||1):0);
const cntW=(t,w)=>{const v=S.wlog[t]&&S.wlog[t][w.id];return v===true?1:(v||0)};
function vRout(){return `<h1>Routinen</h1><p class="sub">Alles, was sich wiederholt.</p>
<h2>Jeden Tag</h2>
${S.habits.map(h=>`<div class="card row"><div class="grow"><div class="t">${esc(h.name)}</div><div class="dots">${Array.from({length:h.target},()=>'<i></i>').join('')}</div></div><div class="tape"><small>PRO TAG</small>${h.target}x</div><button class="x" data-a="delh" data-id="${h.id}">${pd===h.id?'<small style="font-size:13px;font-weight:800">Löschen?</small>':'×'}</button></div>`).join('')||'<div class="empty">Noch keine Gewohnheiten.</div>'}
<div class="form"><input id="hn" placeholder="Neue Gewohnheit" style="flex:1"><input id="ht" type="number" min="1" max="20" value="1" aria-label="Wie oft pro Tag"><button class="btn" data-a="addh">Hinzufügen</button></div>
${weeklyManage()}`}
function weeklyManage(){return `<h2>Jede Woche</h2><p class="mut" style="margin:0 0 8px">Feste Aufgaben pro Wochentag. Sie erscheinen am jeweiligen Tag im Tab „Heute“ unter „Heute dran“.</p>
${[1,2,3,4,5,6,0].flatMap(d=>S.weekly.filter(w=>w.day===d)).map(w=>`<div class="card row"><div class="grow"><div class="t">${esc(w.title)}</div><div class="mut" style="font-size:13px">${esc(DAYS[w.day])}${w.time?', '+esc(w.time)+' Uhr':', ganztägig'}</div><div class="dots">${Array.from({length:w.target||1},()=>'<i></i>').join('')}</div></div><div class="tape"><small>TAG</small>${DAYS[w.day].slice(0,2).toUpperCase()}</div><button class="x" data-a="delw" data-id="${w.id}">${pd===w.id?'<small style="font-size:13px;font-weight:800">Löschen?</small>':'×'}</button></div>`).join('')||'<div class="empty">Noch nichts Wiederkehrendes.</div>'}
<div class="form"><input id="wn" placeholder="z. B. Retainer putzen" style="flex:1"><select id="wd" aria-label="Wochentag">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${d===0?'selected':''}>${DAYS[d]}</option>`).join('')}</select><input id="wt" type="time" aria-label="Uhrzeit"><label>Wie oft <input id="wx" type="number" min="1" max="20" value="1"></label><button class="btn" data-a="addw">Hinzufügen</button></div>`}
function vKal(){
const y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
let g=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
for(let i=1;i<=days;i++){const s=y+'-'+pad(m+1)+'-'+pad(i),ev=S.events.filter(e=>e.date===s).length,dd=S.todos.filter(x=>x.due===s&&!x.done).length;
g+=`<button data-a="day" data-d="${s}" class="${s===today()?'today':''} ${s===sel?'sel':''} ${ev||dd?'has':''}"><span>${i}</span><em>${'<i></i>'.repeat(Math.min(ev,3))+'<i class="d"></i>'.repeat(Math.min(dd,3))}</em></button>`}
const evs=S.events.filter(e=>e.date===sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const dues=S.todos.filter(x=>x.due===sel);
return `<h1>Kalender</h1>
<div class="big" style="margin:8px 0"><button class="btn ghost" data-a="mp">‹</button><b>${MON[m]} ${y}</b><button class="btn ghost" data-a="mn">›</button></div>
<div class="cal">${g}</div>
<p class="mut" style="font-size:13px;margin:8px 0 0"><span style="color:var(--red)">●</span> Termin &nbsp; <span style="color:var(--ok)">●</span> Frist &nbsp; Tage mit Eintrag haben einen dicken Rahmen</p>
<h2>${fmt(sel)}</h2>
${evs.map(e=>`<div class="card row"><span class="mono">${esc(e.time?e.time+(e.end?'–'+e.end:''):'ganztägig')}</span><span class="grow">${esc(e.title)}</span><button class="x" data-a="dele" data-id="${e.id}">×</button></div>`).join('')}
${dues.map(x=>`<div class="card row"><span class="mono">${esc(x.time||'Frist')}</span><span class="grow ${x.done?'strike':''}">${esc(x.title)}</span></div>`).join('')}
${(wk=>wk.map(w=>`<div class="card row"><span class="mut">Wöchentlich</span><span class="grow">${esc(w.title)}</span></div>`).join('')+(!evs.length&&!dues.length&&!wk.length?'<div class="empty">Nichts geplant. Trag unten einen Termin ein.</div>':''))(S.weekly.filter(w=>w.day===new Date(sel+'T12:00').getDay()))}
<div class="form"><input id="en" placeholder="Termin" style="flex:1 1 100%"><label>Von <input id="et" type="time"></label><label>Bis <input id="ee" type="time"></label><button class="btn" data-a="adde">Eintragen</button></div>`}
function vTodos(){
const t=today(),open=S.todos.filter(x=>!x.done).sort((a,b)=>((a.due||'9999')+(a.time||'')).localeCompare((b.due||'9999')+(b.time||''))),dn=S.todos.filter(x=>x.done);
const it=x=>`<div class="card hab row ${x.done?'done':''}" data-a="tog" data-id="${x.id}">
<div class="grow"><div class="t">${esc(x.title)}</div>${x.due?`<div class="${!x.done&&x.due<t?'over':'mut'}" style="font-size:13px">${x.due<t&&!x.done?'Überfällig seit ':'Bis '}${fmt(x.due)}${x.time?', '+esc(x.time)+' Uhr':''}</div>`:''}<div class="dots">${Array.from({length:x.target||1},(_,i)=>`<i class="${i<cntT(x)?'on':''}"></i>`).join('')}</div></div>
<div class="tape"><small>ERLEDIGT</small>${cntT(x)}/${x.target||1}</div><button class="x" data-a="delt" data-id="${x.id}">×</button></div>`;
return `<h1>Todos</h1><p class="sub">Mit Frist, sortiert nach Datum.</p>
<div class="form"><input id="tn" placeholder="Was muss fertig werden?" style="flex:1"><input id="td" type="date" aria-label="Frist"><input id="tt" type="time" aria-label="Uhrzeit"><label>Wie oft <input id="tx" type="number" min="1" max="20" value="1"></label><button class="btn" data-a="addt">Hinzufügen</button></div>
${open.map(it).join('')||'<div class="empty">Alles erledigt.</div>'}
${dn.length?'<h2>Erledigt</h2>'+dn.map(it).join(''):''}
${ideasView()}`}
function vBackup(){
const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
return `<h1>Backup</h1><p class="sub">Deine Daten liegen nur auf diesem Gerät. Sichere sie regelmäßig.</p>
<div class="card">${days===null?'<b class="over">Noch kein Backup gemacht.</b>':days>=7?`<b class="over">Letztes Backup vor ${days} Tagen.</b>`:`<b>Letztes Backup vor ${days} Tag${days===1?'':'en'}.</b>`}</div>
<h2>Sichern</h2><p class="mut">Kopieren und in Notizen, iCloud-Mail oder WhatsApp an dich selbst einfügen.</p>
<textarea id="bk" readonly></textarea>
<div class="form"><button class="btn" data-a="copy">Kopieren</button></div>
<h2>Wiederherstellen</h2><p class="mut">Gesicherten Text hier einfügen. Das ersetzt alle aktuellen Daten.</p>
<textarea id="im" placeholder="Backup hier einfügen"></textarea>
<div class="form"><button class="btn" data-a="imp">Wiederherstellen</button></div>
<p id="msg" class="mut">${esc(msg)}</p>`}
function render(){
const v={heute:vHeute,kal:vKal,todos:vTodos,rout:vRout,backup:vBackup}[tab]();
document.getElementById('app').innerHTML=v;
document.getElementById('nav').innerHTML=[['heute','Heute'],['kal','Kalender'],['todos','Todos'],['rout','Routinen'],['backup','Backup']].map(([k,l])=>`<button data-a="tab" data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
if(tab==='backup')document.getElementById('bk').value=JSON.stringify(S);
}
const val=id=>document.getElementById(id).value.trim();
document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,t=today();if(a!=='delh'&&a!=='delw'&&a!=='deli'&&a!=='imp')pd='';
if(a==='tab'){tab=b.dataset.t;msg=''}
else if(a==='inc'){const h=S.habits.find(x=>x.id===id);S.log[t]=S.log[t]||{};const c=cnt(t,id)+1;S.log[t][id]=c>h.target?0:c}
else if(a==='edit')edit=!edit;
else if(a==='delh'){if(pd!==id)pd=id;else{S.habits=S.habits.filter(x=>x.id!==id);pd=''}}
else if(a==='addh'){const n=val('hn');if(!n)return;S.habits.push({id:uid(),name:n,target:Math.max(1,parseInt(val('ht'))||1)})}
else if(a==='mp')cm.setMonth(cm.getMonth()-1);
else if(a==='mn')cm.setMonth(cm.getMonth()+1);
else if(a==='day')sel=b.dataset.d;
else if(a==='adde'){const n=val('en');if(!n)return;S.events.push({id:uid(),date:sel,time:val('et'),end:val('ee'),title:n})}
else if(a==='dele')S.events=S.events.filter(x=>x.id!==id);
else if(a==='addt'){const n=val('tn');if(!n)return;S.todos.push({id:uid(),title:n,due:val('td')||today(),time:val('tt'),target:Math.max(1,parseInt(val('tx'))||1),count:0,done:false})}
else if(a==='wtog'){const w=S.weekly.find(x=>x.id===id),g=w.target||1;S.wlog[t]=S.wlog[t]||{};let c=cntW(t,w)+1;if(c>g)c=0;S.wlog[t][id]=c}
else if(a==='delw'){if(pd!==id)pd=id;else{S.weekly=S.weekly.filter(x=>x.id!==id);pd=''}}
else if(a==='addw'){const n=val('wn');if(!n)return;S.weekly.push({id:uid(),title:n,day:parseInt(document.getElementById('wd').value),time:val('wt'),target:Math.max(1,parseInt(val('wx'))||1)})}
else if(a==='tog'){const x=S.todos.find(x=>x.id===id),g=x.target||1;x.count=cntT(x)+1;if(x.count>g)x.count=0;x.done=x.count>=g}
else if(a==='addi'){const n=val('idn');if(!n)return;S.ideas.unshift({id:uid(),text:n,day:t})}
else if(a==='deli'){if(pd!==id)pd=id;else{S.ideas=S.ideas.filter(x=>x.id!==id);pd=''}}
else if(a==='delt')S.todos=S.todos.filter(x=>x.id!==id);
else if(a==='copy'){const el=document.getElementById('bk');el.select();let ok=false;
try{navigator.clipboard.writeText(el.value);ok=true}catch(_){try{ok=document.execCommand('copy')}catch(__){}}
S.lastBackup=Date.now();save();msg=ok?'Kopiert. Jetzt irgendwo einfügen und speichern.':'Text markieren und manuell kopieren.';render();return}
else if(a==='imp'){try{const d=JSON.parse(val('im'));if(!d.habits||!d.log)throw 0;if(pd!=='imp'){pd='imp';document.getElementById('msg').textContent='Tippe nochmal auf Wiederherstellen, um alle aktuellen Daten zu ersetzen.';return}pd='';S=d;S.weekly=S.weekly||[];S.wlog=S.wlog||{};S.ideas=S.ideas||[];msg='Wiederhergestellt.'}catch(_){msg='Das war kein gültiges Backup.'}}
save();render()});
render();
</script></body></html>
